name: aiproviso

services:
  # ─────────────────────────────────────────────────────────────
  # POSTGRES 16 — Platform Master Database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: proviso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proviso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proviso_dev_password}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proviso} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # REDIS 7 — Session Cache + BullMQ Event Streams + DLQ
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: proviso-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # BACKEND API — Flask sandbox (Phase I). Target: Fastify (Phase II).
  # See PRD v8 Section 4.5 for transition strategy.
  # ─────────────────────────────────────────────────────────────
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proviso-backend-api
    restart: unless-stopped
    environment:
      PORT: "5000"
      FLASK_DEBUG: "0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-proviso}:${POSTGRES_PASSWORD:-proviso_dev_password}@postgres:5432/proviso"
      REDIS_URL: "redis://redis:6379/0"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      FLOWISE_BASE_URL: "http://flowise:3000"
      WORKFLOW_ENGINE_BASE_URL: "http://workflow-engine:5100"
      N8N_BASE_URL: "http://n8n:5678"
      N8N_WEBHOOK_TOKEN: "${N8N_WEBHOOK_TOKEN:-proviso-dev-token}"
      WORKFLOW_WEBHOOK_SECRET: "${WORKFLOW_WEBHOOK_SECRET:-proviso-dev-workflow-signing-secret}"
      PAPERLESS_BASE_URL: "http://paperless:8000"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-env}"
    ports:
      - "${BACKEND_API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # WORKFLOW ENGINE — Dedicated XState runtime for workflow evaluation
  # Persists no state locally. PostgreSQL remains the source of truth.
  # ─────────────────────────────────────────────────────────────
  workflow-engine:
    build:
      context: ./workflow-engine
      dockerfile: Dockerfile
    container_name: proviso-workflow-engine
    restart: unless-stopped
    environment:
      PORT: "5100"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-proviso}:${POSTGRES_PASSWORD:-proviso_dev_password}@postgres:5432/proviso"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "${WORKFLOW_ENGINE_PORT:-5100}:5100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:5100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # OCR WORKER — Dedicated container for PaddleOCR + DocTR
  # Polls Redis BullMQ queue: ocr:jobs
  # PRD v8 Section 4.3: isolated compute; horizontally scalable
  # Phase I: stub that logs receipt and ACKs. Real OCR in Week 3-4.
  # ─────────────────────────────────────────────────────────────
  ocr-worker:
    build:
      context: ./ocr-worker
      dockerfile: Dockerfile
    container_name: proviso-ocr-worker
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-proviso}:${POSTGRES_PASSWORD:-proviso_dev_password}@postgres:5432/proviso"
      N8N_BASE_URL: "http://n8n:5678"
      N8N_WEBHOOK_TOKEN: "${N8N_WEBHOOK_TOKEN:-proviso-dev-token}"
      WORKFLOW_ENGINE_BASE_URL: "http://workflow-engine:5100"
      OCR_MODE: "${OCR_MODE:-stub}"  # stub | paddle | ensemble
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # TIMER WORKER — BullMQ consumer for timer lifecycle callbacks
  # Posts signed webhook requests back to backend-api when timer jobs fire.
  # ─────────────────────────────────────────────────────────────
  timer-worker:
    build:
      context: ./timer-worker
      dockerfile: Dockerfile
    container_name: proviso-timer-worker
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis:6379/0"
      BACKEND_BASE_URL: "http://backend-api:5000"
      WORKFLOW_WEBHOOK_SECRET: "${WORKFLOW_WEBHOOK_SECRET:-proviso-dev-workflow-signing-secret}"
      TIMER_EVENTS_QUEUE: "workflow-timer-events"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # N8N — Event Spine + Orchestration Hooks
  # Auto-seeded from ./config/n8n/workflows/ on startup
  # ─────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.22.3
    container_name: proviso-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "n8n"
      DB_POSTGRESDB_USER: "${POSTGRES_USER:-proviso}"
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD:-proviso_dev_password}"
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_EDITOR_BASE_URL: "http://localhost:5678"
      # localhost so n8n's internal webhook-registration call hits its own loopback
      WEBHOOK_URL: "http://localhost:5678/"
      # Allow session cookies over plain HTTP (local/internal deployment only)
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: "${TIMEZONE:-UTC}"
      TZ: "${TIMEZONE:-UTC}"
      # n8n 2.x removed Basic Auth — user management is the only auth layer
      # Disable telemetry
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      # Task runners required for webhook execution in n8n 2.x
      N8N_RUNNERS_ENABLED: "true"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config/n8n/workflows:/home/node/.n8n/workflows
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # GOTENBERG — Office-to-PDF conversion (invoked by MOD-01)
  # ─────────────────────────────────────────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: proviso-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # TIKA — Raw text pre-extraction before OCR (invoked by MOD-01)
  # ─────────────────────────────────────────────────────────────
  tika:
    image: apache/tika:3.1.0.0
    container_name: proviso-tika
    restart: unless-stopped
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # PAPERLESS-NGX — Document archive + thumbnail storage ONLY
  # PAPERLESS_OCR_MODE=skip is LOCKED per PRD v8 Decision 1.
  # MOD-02 owns all OCR. Paperless never runs its own OCR.
  # ─────────────────────────────────────────────────────────────
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.18.3
    container_name: proviso-paperless
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    environment:
      PAPERLESS_REDIS: "redis://redis:6379"
      PAPERLESS_DBHOST: "postgres"
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: "paperless"
      PAPERLESS_DBUSER: "${POSTGRES_USER:-proviso}"
      PAPERLESS_DBPASS: "${POSTGRES_PASSWORD:-proviso_dev_password}"
      PAPERLESS_URL: "${PAPERLESS_URL:-http://localhost:8000}"
      PAPERLESS_SECRET_KEY: "${PAPERLESS_SECRET_KEY:-change-me-in-env}"
      PAPERLESS_TIME_ZONE: "${TIMEZONE:-UTC}"
      # ── LOCKED: OCR is disabled. MOD-02 owns all text extraction. ──
      PAPERLESS_OCR_MODE: "skip"
      # Tika is used for Office format conversion only, not OCR
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: "http://gotenberg:3000"
      PAPERLESS_TIKA_ENDPOINT: "http://tika:9998"
    ports:
      - "${PAPERLESS_PORT:-8000}:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # FLOWISE — LangChain agents + RAG pipelines
  # Flows auto-seeded from ./config/flowise/ via REST API on startup
  # PRD v8 Decision 2: flows committed as Git-tracked JSON
  # ─────────────────────────────────────────────────────────────
  flowise:
    image: flowiseai/flowise:2.2.7
    container_name: proviso-flowise
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_TYPE: "postgres"
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "proviso"
      DATABASE_USER: "${POSTGRES_USER:-proviso}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:-proviso_dev_password}"
      FLOWISE_SECRETKEY_OVERWRITE: "${FLOWISE_SECRETKEY:-change-me-in-env}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    ports:
      - "${FLOWISE_PORT:-3001}:3000"
    volumes:
      - flowise_data:/root/.flowise
      - ./config/flowise:/root/.flowise/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
    networks:
      - proviso-net

  # ─────────────────────────────────────────────────────────────
  # OLLAMA — Local LLM Runtime (optional profile)
  # Enable with: docker compose --profile local-ai up
  # Or point to Mac M2: set OLLAMA_BASE_URL=http://macbook-m2.local:11434
  # ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.11.4
    container_name: proviso-ollama
    profiles: ["local-ai"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 15
    networks:
      - proviso-net

  ollama-pull:
    image: curlimages/curl:8.12.1
    container_name: proviso-ollama-pull
    profiles: ["local-ai"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:3b}"
    entrypoint:
      - sh
      - -c
      - |
        echo "Pulling Ollama model: $$OLLAMA_MODEL";
        curl -fsS http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$OLLAMA_MODEL\"}";
        echo "Model pull complete";
    networks:
      - proviso-net

networks:
  proviso-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_consume:
  ollama_data:
  flowise_data:
